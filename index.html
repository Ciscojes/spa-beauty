<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ejemplo de sitio para un spa creado con HTML5 Boilerplate, Vite y Sass."
    />
    <meta name="theme-color" content="#f8f2f5" />
    <title>Spa & Beauty</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400&family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__left">
        <img src="/images/logotipo.svg" alt="Beauty logotipo" class="logo" />

        <nav class="nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Facilities</a></li>
            <li><a href="#">More</a></li>
          </ul>
        </nav>
      </div>

      <div class="header__right">
        <button class="icon-button">
          <img src="/images/search.png" alt="" />
        </button>
        <button class="icon-button">
          <img src="/images/candado.png" alt="" />
        </button>
        <a href="#" class="sign-in">Sign In</a>
        <a href="#" class="sign-up">Sign Up</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero__content">
          <h1 class="hero__title">
            Bring back the beauty and glow of your skin
          </h1>

          <p class="hero__description">
            We provide you various treatments from head to toe using the best
            product, advanced technology, and affordable price
          </p>

          <div class="hero__actions">
            <a href="#" class="hero__button hero__button--primary">
              Book Now
            </a>

            <a href="#" class="hero__button hero__button--video">
              <span class="hero__play">
                <img src="/images/video-icon.svg" alt="" />
              </span>

              <span>Watch Video</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
